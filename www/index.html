<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#14304a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="حساب الرملة" />
  <title>حساب الرملة للفورمة</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #f3f0e8;
      --card: #ffffff;
      --ink: #13293d;
      --muted: #5c6b7a;
      --primary: #14304a;
      --primary-2: #1f4e78;
      --accent: #c86d19;
      --accent-soft: #fdf2e6;
      --ok: #1b6e46;
      --ok-soft: #eaf6ef;
      --border: #dfd8ca;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(19, 41, 61, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 36px 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Naskh Arabic", "Cairo", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    .app-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color: #fff;
      padding: 18px 16px 22px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: var(--shadow);
    }

    .header-row {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .app-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
      background: var(--primary);
    }

    .app-title {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .app-sub {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.86);
    }

    .container {
      max-width: 540px;
      margin: -12px auto 0;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .result-card {
      background: #fffdfb;
      border: 2px solid var(--accent);
    }

    .result-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .result-label {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
    }

    .badge {
      background: var(--ok-soft);
      color: var(--ok);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .main-number {
      font-size: 2.35rem;
      font-weight: 900;
      color: var(--accent);
      margin: 6px 0 2px;
      line-height: 1.15;
    }

    .sub-number {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .order-box {
      background: var(--accent-soft);
      border-right: 4px solid var(--accent);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--ink);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .stat-box {
      background: #f8f6f0;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }

    .stat-title {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 700;
    }

    .stat-val {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--primary);
      margin-top: 2px;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary);
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .mode-btn {
      border: 1.5px solid var(--border);
      background: #faf8f4;
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 8px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 800;
      margin-bottom: 5px;
      color: var(--ink);
    }

    .hint {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 600;
      margin-top: 3px;
    }

    input[type="number"], select {
      width: 100%;
      padding: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid #c9c0b1;
      border-radius: 12px;
      outline: none;
    }

    input[type="number"]:focus, select:focus {
      border-color: var(--primary-2);
      box-shadow: 0 0 0 3px rgba(31, 78, 120, 0.14);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .chip {
      background: #f3f0e8;
      border: 1px solid var(--border);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .chip:active {
      transform: scale(0.97);
      background: var(--accent-soft);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      padding: 12px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      border: none;
      text-align: center;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: #ece7dc;
      color: var(--ink);
    }
