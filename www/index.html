<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14304a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="حساب الرملة للفورمة" />
  <title>حساب الرملة للفورمة</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #f3f0e8;
      --card: #ffffff;
      --ink: #13293d;
      --muted: #5c6b7a;
      --primary: #14304a;
      --primary-2: #1f4e78;
      --accent: #c86d19;
      --accent-soft: #fdf2e6;
      --ok: #1b6e46;
      --ok-soft: #eaf6ef;
      --border: #dfd8ca;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(19, 41, 61, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    .app {
      max-width: 680px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
    }

    .header p {
      margin: 0;
      font-size: 0.92rem;
      opacity: 0.92;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      color: var(--ink);
      background: #fff;
    }

    input:focus, select:focus {
      outline: 2px solid var(--primary-2);
      border-color: var(--primary-2);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 140px;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-calc {
      background: var(--accent);
      color: #fff;
    }

    .btn-reset {
      background: #eef2f6;
      color: var(--ink);
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 520px) {
      .results {
        grid-template-columns: 1fr;
      }
    }

    .box {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #fcfbf8;
    }

    .box.highlight {
      background: var(--accent-soft);
      border-color: #f0c99e;
    }

    .box.ok {
      background: var(--ok-soft);
      border-color: #b7dec8;
    }

    .box-label {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .box-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--ink);
    }

    .note {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
